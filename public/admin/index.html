<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Administrativo - Igreja</title>

    <!-- Aponta diretamente para o arquivo de configuração YAML -->
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" rel="stylesheet" />

    <!-- Widget de Login Netlify Identity -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <!-- Script do CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.reload();
            });
          }
        });
      }
    </script>

    <script>
      if (location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.hostname.includes("webcontainer")) {
        window.netlifyIdentity.init({
          APIUrl: "https://https://christian-family.netlify.app/.netlify/identity"
        });
      }
    </script>
  </body>
</html>
