<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Painel Administrativo - Igreja</title>
    
    <link href="config.yml" type="text/yaml" rel="cms-config-url" />

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
      const MEU_SITE_NETLIFY = "https://christian-family.netlify.app";

      if (location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.hostname.includes("webcontainer")) {
        window.netlifyIdentity.init({
          APIUrl: MEU_SITE_NETLIFY + "/.netlify/identity"
        });
      }

      // Regra de redirecionamento após o login
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.reload();
          });
        }
      });
    </script>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
