backend:
  name: github
  repo: GabrielSBrito17/christian-family-astro
  branch: develop # Altere para 'main' se quiser que o CMS salve na branch principal
  base_url: https://netlify-cms.adrianub.vercel.app # Proxy para autenticação no Vercel

media_folder: "public/images/uploads"
public_folder: "/images/uploads"
site_url: "https://christian-family-git-develop-gabrielsbrito17s-projects.vercel.app"

# Coleções de Conteúdo para a Igreja
collections:
  - name: "comunicados"
    label: "Comunicados e Avisos"
    folder: "src/content/comunicados"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string" }
      - { label: "Data de Publicação", name: "data", widget: "datetime" }
      - { label: "Aviso Urgente?", name: "urgente", widget: "boolean", default: false }
      - { label: "Mensagem", name: "body", widget: "markdown" }

  - name: "cultos"
    label: "Horários dos Cultos"
    folder: "src/content/cultos"
    create: true
    identifier_field: "nome"
    fields:
      - { label: "Nome do Culto", name: "nome", widget: "string", example: "Culto de Celebração" }
      - { label: "Dia da Semana", name: "dia", widget: "select", options: ["Domingo", "Segunda", "Terça", "Quarta", "Quinta", "Sexta", "Sábado"] }
      - { label: "Descrição/Observação", name: "descricao", widget: "text", required: false }
      - label: "Horários"
        name: "horarios"
        widget: "list"
        fields:
          - { label: "Rótulo (Ex: Pequeno Almoço)", name: "rotulo", widget: "string" }
          - { label: "Hora (Ex: 09:00)", name: "hora", widget: "string" }

  - name: "eventos"
    label: "Eventos e Calendário"
    folder: "src/content/eventos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Nome do Evento", name: "titulo", widget: "string", example: "Retiro de Jovens" }
      - { label: "Categoria / Tag", name: "tag", widget: "select", options: ["Retiro", "Acampamento", "Oração no Monte", "Confraternização", "Outros", "Conferência"] }
      - { label: "Data do Evento (Texto)", name: "data", widget: "string", example: "15 a 17 de Outubro" }
      - { label: "Local", name: "local", widget: "string", example: "Auditório Principal" }
      - { label: "Imagem / Banner", name: "imagem", widget: "image", required: false }
      - { label: "Descrição e Detalhes", name: "descricao", widget: "text" }